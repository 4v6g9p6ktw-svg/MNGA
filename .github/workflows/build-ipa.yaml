name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: jdx/mise-action@v4

      - name: Install Prereqs
        run: brew install swift-protobuf

      - name: 确认工具链版本
        run: |
          xcodebuild -version
          rustc --version
          cargo --version
          tuist version
          protoc --version

      - name: Build Logic (iOS device)
        run: make logic ALL_TARGETS="aarch64-apple-ios" MODE=debug
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache

      - name: Generate Xcode Project
        working-directory: app
        run: tuist generate --no-open

      - name: 定位工程与 scheme
        working-directory: app
        run: |
          ls -la
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1 || true)
          PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -1 || true)
          if [ -n "$WORKSPACE" ]; then echo "TARGET_ARG=-workspace $WORKSPACE" >> $GITHUB_ENV; else echo "TARGET_ARG=-project $PROJECT" >> $GITHUB_ENV; fi
          echo "---- schemes ----"
          xcodebuild $TARGET_ARG -list

      - name: Build .app（关闭签名）
        working-directory: app
        run: |
          xcodebuild $TARGET_ARG \
            -scheme MNGA \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 .ipa
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "❌ 没找到 .app 产物"; find build -maxdepth 4 -type d | head -50; exit 1; fi
          echo "找到 app: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MNGA-unsigned.ipa Payload
          ls -lh MNGA-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MNGA-unsigned-ipa
          path: MNGA-unsigned.ipa
          retention-days: 14
